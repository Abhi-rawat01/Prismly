name: Keep Server Awake

on:
  schedule:
    # Runs once daily at 5:00 AM IST (11:30 PM UTC previous day)
    # Wakes server after sleep window (2-5 AM IST)
    - cron: '30 23 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install Puppeteer
        run: npm install puppeteer
      
      - name: Visit website and keep alive
        run: |
          node -e "
          const puppeteer = require('puppeteer');
          
          (async () => {
            console.log('🚀 Launching browser...');
            const browser = await puppeteer.launch({
              headless: 'new',
              args: ['--no-sandbox', '--disable-setuid-sandbox']
            });
            
            const page = await browser.newPage();
            
            console.log('🌐 Opening Prismly website...');
            await page.goto('https://prismly-9eeg.onrender.com', {
              waitUntil: 'networkidle2',
              timeout: 120000
            });
            
            console.log('✅ Website loaded successfully!');
            console.log('⏳ Keeping page open for 5 minutes to trigger self-ping...');
            
            // Keep the page open for 5 minutes (300 seconds)
            await new Promise(resolve => setTimeout(resolve, 300000));
            
            console.log('💚 Self-ping mechanism should be active now!');
            
            await browser.close();
            console.log('✨ Done! Server is awake and will maintain itself.');
          })();
          "
      
      - name: Verify server is responding
        run: |
          echo "🔍 Checking server health..."
          curl -f https://prismly-9eeg.onrender.com/api/health || exit 1
          echo "✅ Server is healthy!"
